{% extends 'base.html' %}{% block content %}<h1>Configurar segundo factor</h1><p>Cuenta: <strong>{{ username }}</strong>. Añada esta cuenta a su aplicación autenticadora mediante el QR o la clave manual.</p><div class="card"><img src="{% url 'mfa_qr' %}" alt="QR privado para configurar el segundo factor" width="260" height="260"><p>Clave manual: <code id="mfa-secret">{{secret}}</code></p><p>No comparta esta clave ni una captura de esta pantalla.</p><form method="post">{% csrf_token %}<label>Código de seis dígitos <input name="code" pattern="[0-9]{6}" maxlength="6" required inputmode="numeric" autocomplete="one-time-code"></label><button>Activar segundo factor</button></form></div>{% endblock %}
